[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "andes_lib"
version = "0.1.0"
description = "Reusable PySpark helpers for the Andes Fabric lakehouse (audit, dedupe, finance checks)."
readme = "README.md"
requires-python = ">=3.11"
# No runtime dependencies: Fabric's Spark runtime already provides pyspark.
dependencies = []

[project.optional-dependencies]
dev = [
    "pyspark>=3.5,<4",
    "pytest",
    "ruff",
]

[tool.setuptools.packages.find]
include = ["andes_lib*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
